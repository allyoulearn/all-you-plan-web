name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly dependency re-scan so newly-disclosed CVEs in unchanged
    # dependencies surface even without a PR (Mondays 06:00 UTC).
    - cron: '0 6 * * 1'

jobs:
  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm run build --if-present
      # Accessibility gate (axe). Installs Chromium, then runs
      # @axe-core/playwright against Wren / a Kanban board / Calendar on a
      # dev-server mock build; the spec fails on any critical/serious WCAG
      # violation, which fails the PR. See playwright.config.js.
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
      - name: Accessibility audit (axe, fail on critical/serious)
        run: npm run test:a11y
      - name: Dependency audit (fail on high/critical)
        run: npm audit --audit-level=high

  security:
    name: security (dependency advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Dedicated, surfaced-as-its-own-check dependency scan. Fails on any
      # High/Critical advisory not listed in the repo-root audit-ci.json
      # allowlist. audit-ci is fetched at runtime via npx so no
      # package.json/devDependency change is required.
      - name: Audit dependencies (audit-ci, allowlist-aware)
        run: npx --yes audit-ci@^7 --high --config audit-ci.json
